<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }

        table {
            border-collapse: collapse;
            width: 60%;
            background-color: white;
        }

        th, td {
            border: 2px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #ddd;
        }
    </style>
</head>
<body>

    <table>
        <caption><b>Student Details</b></caption>

        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Branch</th>
            <th>Semester</th>
        </tr>

        <tr>
            <td>101</td>
            <td>Rahul</td>
            <td>CSE</td>
            <td>1st</td>
        </tr>

        <tr>
            <td>102</td>
            <td>Priya</td>
            <td>ECE</td>
            <td>2nd</td>
        </tr>

        <tr>
            <td>103</td>
            <td>Amit</td>
            <td>ME</td>
            <td>3rd</td>
        </tr>

    </table>

</body>
</html>
