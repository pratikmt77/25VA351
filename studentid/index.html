<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student ID Card</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="id-card">

    <div class="card-header">
      <h2>YOUR COLLEGE NAME</h2>
      <p>Student Identity Card</p>
    </div>

    <div class="photo-wrapper">
      <!-- Replace src with your own photo, e.g. "me.jpg" -->
      <img src="https://via.placeholder.com/100" alt="Student Photo" />
    </div>

    <div class="card-body">
      <h3>Patrick</h3>
      <p class="course">B.Tech - Computer Science</p>

      <div class="details">
        <p><span>Roll No:</span> 2400000000</p>
        <p><span>Branch:</span> CSE</p>
        <p><span>Year:</span> 1st Year</p>
        <p><span>DOB:</span> 01-01-2006</p>
        <p><span>Phone:</span> +91 98765 43210</p>
      </div>
    </div>

    <div class="barcode"></div>

    <div class="card-footer">
      Valid till: 2028 | If found, please return to college
    </div>

  </div>

</body>
</html>
